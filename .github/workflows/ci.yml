name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Install only the URLs and SHA-256 checksums recorded in mise.lock.
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tools pinned in mise.toml, verified against mise.lock.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.1
          cache: false

      # The lint task is defined in mise.toml, which the PR controls, the same as this
      # workflow file. That is intentional: on pull_request, PR code is untrusted and
      # unprivileged, and owner review is the merge gate. See "Trust model" in CLAUDE.md.
      - name: Lint
        run: mise run lint
        env:
          GH_TOKEN: ${{ github.token }}
