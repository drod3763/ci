name: ci

on:
  pull_request:
    branches: [main]
    # edited: re-check when the PR title changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Squash merges use the PR title as the commit message on main.
      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|docs|ci|build|refactor|perf|test|style|revert)(\([a-z0-9._-]+\))?!?: .+'
          if ! grep -Eq "$pattern" <<<"$TITLE"; then
            echo "::error title=PR title::Use a Conventional Commit title, e.g. 'feat(brew-bump): add digest check'. Got: $TITLE"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tool versions pinned in mise.toml.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.1
          cache: false

      - name: Lint
        run: mise run lint
        env:
          GH_TOKEN: ${{ github.token }}
